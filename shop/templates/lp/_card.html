{% from "shot.html" import shot %}
<article class="lp-card" data-sku="{{ item.sku }}">
  <a class="lp-card-shot" href="{{ item.grab_href }}">
    <img src="{{ shot(item.image) }}" width="480" height="480" alt="{{ item.name }}" decoding="async" {% if eager|default(false) %}fetchpriority="high"{% else %}loading="lazy"{% endif %}>
  </a>
  <div class="lp-card-meta">
    <h3 class="lp-card-title">{{ item.name }}</h3>
    <p class="lp-card-price"><strong>{{ item.price }}</strong>{% if item.original %}<s>{{ item.original }}</s>{% endif %}</p>
    <p class="lp-card-stock">{% if item.only_left %}{{ item.only_left }} left{% elif item.stock %}In stock{% else %}In stock{% endif %}</p>
    <a class="lp-grab" href="{{ item.grab_href }}">Grab</a>
  </div>
</article>
