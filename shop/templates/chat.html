{% extends "base.html" %}
{% block body %}
<div class="fn-chat" style="max-width:720px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;min-height:70vh">
  <header style="display:flex;align-items:center;gap:10px">
    <a href="{{ href('/', country) }}" aria-label="{{ t.back }}">←</a>
    <h1 style="margin:0;font-size:22px">{{ t.chat_title }}</h1>
  </header>
  <div id="cs-log" style="flex:1;margin:12px 0;display:flex;flex-direction:column;gap:8px"></div>
  <form id="cs-form" style="display:flex;gap:8px;align-items:center">
    <input id="cs-file" type="file" accept="image/*" aria-label="attachment" style="max-width:42%">
    <input id="cs-text" type="text" placeholder="{{ t.chat_placeholder }}" autocomplete="off" style="flex:1;height:44px;border-radius:12px;border:1px solid #E6E1DA;padding:0 12px">
    <button class="btn" type="submit">{{ t.chat_send }}</button>
  </form>
  <p id="cs-err" class="muted"></p>
</div>
<script>
(function () {
  var log = document.getElementById("cs-log");
  var err = document.getElementById("cs-err");
  var room = "";
  var last = 0;
  var params = new URLSearchParams(location.search);
  function paint(messages) {
    (messages || []).forEach(function (m) {
      if (!m || m.id <= last) return;
      last = m.id;
      var row = document.createElement("div");
      row.style.cssText = "align-self:" + (m.role === "user" ? "flex-end" : "flex-start") + ";max-width:80%;background:#fff;border-radius:14px;padding:8px 12px;border:1px solid #EFEAE4";
      row.textContent = (m.body || "");
      log.appendChild(row);
    });
    log.scrollTop = log.scrollHeight;
  }
  function current() {
    if (!params.get("sku")) return null;
    return { sku: params.get("sku"), name: params.get("name") || "", image: params.get("image") || "", price: params.get("price") || "" };
  }
  async function openRoom() {
    var res = await fetch("/api/cs/open", {
      method: "POST", credentials: "include",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ current: current(), sku: params.get("sku") || "", name: params.get("name") || "", history: [], cart: [] })
    });
    var data = await res.json();
    if (!data.ok) throw new Error("open");
    room = data.room && data.room.id;
    paint(data.messages);
  }
  async function poll() {
    if (!room) return;
    var res = await fetch("/api/cs/poll?room_id=" + encodeURIComponent(room) + "&after=" + last + "&timeout=1", { credentials: "include", headers: { "Accept": "application/json" } });
    var data = await res.json();
    paint(data.messages || data.items || []);
  }
  document.getElementById("cs-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    err.textContent = "";
    var text = document.getElementById("cs-text").value.trim();
    var file = document.getElementById("cs-file").files[0];
    try {
      if (!room) await openRoom();
      if (file) {
        var body = new FormData();
        body.append("room_id", room);
        body.append("file", file);
        var up = await fetch("/api/cs/upload", { method: "POST", credentials: "include", body: body });
        var saved = await up.json();
        if (saved.url) text = (text ? text + " " : "") + saved.url;
      }
      if (!text) return;
      var sent = await fetch("/api/cs/send", {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ room_id: room, body: text })
      });
      var data = await sent.json();
      if (!data.ok) throw new Error(data.error || "send");
      document.getElementById("cs-text").value = "";
      document.getElementById("cs-file").value = "";
      if (data.message) paint([data.message]);
    } catch (e) {
      err.textContent = "Could not send.";
    }
  });
  openRoom().catch(function () { err.textContent = "Could not open chat."; });
  setInterval(function () { poll().catch(function () {}); }, 4000);
})();
</script>
{% endblock %}
