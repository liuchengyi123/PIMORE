<label class="{{ _lang_class|default('fn-locale-pill') }}" style="position:relative;cursor:pointer">
  {% include "_lang_mark.html" %}
  <select name="lang" aria-label="{{ t.locale }}" onchange="harborLang(this)" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;margin:0;border:0">
    {% for code, label in [('en', 'English'), ('zh', '简体中文'), ('zh-Hant', '繁體中文'), ('ja', '日本語'), ('de', 'Deutsch'), ('fr', 'Français'), ('es', 'Español'), ('pt', 'Português')] %}
    <option value="{{ code }}" {% if lang == code %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</label>
