# Reject secret-file and exploit probes before they reach the app.
server_tokens off;

location ~ /\.(?!well-known) {
    return 404;
}

location ~* ^/(wp-admin|wp-login\.php|wp-json|xmlrpc\.php|phpmyadmin|pma|adminer)(/|$) {
    return 404;
}

location ~* \.(php|asp|aspx|cgi|env|sql|bak|swp|old|orig)$ {
    return 404;
}
