# Reject secret-file and exploit probes before they reach the app.
# Include this file from the server that also has `listen 443 ssl http2;`.
# Versioned /static assets (?v=) get Cache-Control immutable from the app.
server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/css
    text/plain
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    application/manifest+json;

location ~ /\.(?!well-known) {
    return 404;
}

location ~* ^/(wp-admin|wp-login\.php|wp-json|xmlrpc\.php|phpmyadmin|pma|adminer)(/|$) {
    return 404;
}

location ~* \.(php|asp|aspx|cgi|env|sql|bak|swp|old|orig)$ {
    return 404;
}
